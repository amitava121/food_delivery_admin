<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Categories — Admin</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍽️</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body class="admin-body" data-page="categories">
    <header class="admin-nav">
      <button class="drawer-burger" id="drawerBtn" hidden aria-label="Menu">
        ☰
      </button>
      <a class="brand" href="index.html"
        ><span class="brand-mark">🍽️</span
        ><span class="brand-name">Spice Route <b>Admin</b></span></a
      >
      <div class="admin-nav-right" id="adminNavRight" hidden>
        <a href="http://localhost:3000" class="admin-link">View site ↗</a>
        <button class="btn-outline" id="logoutBtn">Log out</button>
      </div>
    </header>

    <div class="admin-layout" id="adminLayout" hidden>
      <aside class="admin-drawer" id="adminDrawer">
        <div class="drawer-head-m">
          <b>Admin</b>
          <button class="drawer-close" id="drawerClose" aria-label="Close menu">
            ✕
          </button>
        </div>
        <nav class="drawer-nav">
          <a class="drawer-item" href="index.html">
            <span class="di-ic">📊</span>Dashboard
          </a>
          <a class="drawer-item" href="orders.html">
            <span class="di-ic">🧾</span>Orders
          </a>
          <a class="drawer-item" href="kitchen.html">
            <span class="di-ic">👨‍🍳</span>Kitchen / Chef
          </a>
          <a class="drawer-item" href="menu.html">
            <span class="di-ic">🍽️</span>Menu items
          </a>
          <a class="drawer-item active" href="categories.html">
            <span class="di-ic">🏷️</span>Categories
          </a>
          <a class="drawer-item" href="banners.html">
            <span class="di-ic">🖼️</span>Promo banners
          </a>
          <a class="drawer-item" href="users.html">
            <span class="di-ic">👥</span>Users
          </a>
          <a class="drawer-item" id="adminsNavItem" href="admins.html" hidden>
            <span class="di-ic">🛡️</span>Admins
          </a>
        </nav>
      </aside>
      <div class="drawer-scrim" id="drawerScrim"></div>

      <main class="admin-main">
        <div class="admin-toolbar">
          <h2>Categories</h2>
          <div class="admin-actions">
            <button class="btn-primary" id="addCatBtn2">+ Add category</button>
          </div>
        </div>
        <p class="banners-hint">
          Category images show in the customer site's bubble row — without one
          the first dish's photo is used.
        </p>
        <div class="banner-list" id="catList"></div>
      </main>
    </div>

    <!-- ===== Category form modal ===== -->
    <div class="modal-overlay" id="catModal">
      <form class="modal dish-form" id="catForm">
        <h3 id="catFormTitle">Add category</h3>
        <div class="form-grid">
          <label class="span2"
            >Category name<input
              name="name"
              required
              maxlength="40"
              placeholder="e.g. South Indian"
          /></label>
          <div class="span2 img-upload">
            <label class="file-label"
              >Upload image<input
                name="c_image_file"
                type="file"
                accept="image/*"
            /></label>
            <img id="cImgPreview" hidden alt="category preview" />
            <button type="button" id="cImgRemove" class="img-remove" hidden>
              ✕ Remove
            </button>
            <span id="cUploadStatus" class="upload-status"></span>
          </div>
        </div>
        <p class="login-err" id="catFormErr" hidden></p>
        <div class="form-actions">
          <button type="button" class="btn-outline" id="catCancel">
            Cancel
          </button>
          <button type="submit" class="btn-primary">Save category</button>
        </div>
      </form>
    </div>

    <div class="toast" id="toast"></div>

    <script src="api.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
