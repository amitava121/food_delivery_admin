<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Users — Admin</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍽️</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body class="admin-body" data-page="users">
    <header class="admin-nav">
      <button class="drawer-burger" id="drawerBtn" hidden aria-label="Menu">
        ☰
      </button>
      <a class="brand" href="index.html"
        ><span class="brand-mark">🍽️</span
        ><span class="brand-name">Spice Route <b>Admin</b></span></a
      >
      <div class="admin-nav-right" id="adminNavRight" hidden>
        <a href="http://localhost:8081" class="admin-link">View site ↗</a>
        <button class="btn-outline" id="logoutBtn">Log out</button>
      </div>
    </header>

    <div class="admin-layout" id="adminLayout" hidden>
      <aside class="admin-drawer" id="adminDrawer">
        <div class="drawer-head-m">
          <b>Admin</b>
          <button class="drawer-close" id="drawerClose" aria-label="Close menu">
            ✕
          </button>
        </div>
        <nav class="drawer-nav">
          <a class="drawer-item" href="index.html">
            <span class="di-ic">📊</span>Dashboard
          </a>
          <a class="drawer-item" href="menu.html">
            <span class="di-ic">🍽️</span>Menu items
          </a>
          <a class="drawer-item" href="categories.html">
            <span class="di-ic">🏷️</span>Categories
          </a>
          <a class="drawer-item" href="banners.html">
            <span class="di-ic">🖼️</span>Promo banners
          </a>
          <a class="drawer-item active" href="users.html">
            <span class="di-ic">👥</span>Users
          </a>
        </nav>
      </aside>
      <div class="drawer-scrim" id="drawerScrim"></div>

      <main class="admin-main">
        <div class="admin-toolbar">
          <h2>Users</h2>
          <div class="admin-actions">
            <div class="filter-wrap">
              <button class="btn-outline" id="userFilterBtn">
                ▾ Filter: <span id="userFilterLabel">All</span>
              </button>
              <div class="filter-pop" id="filterModal">
                <button
                  type="button"
                  class="filter-opt"
                  data-filter="all"
                  onclick="setUserFilter('all')"
                >
                  All users<span class="fo-sub">admins + customers</span>
                </button>
                <button
                  type="button"
                  class="filter-opt"
                  data-filter="admin"
                  onclick="setUserFilter('admin')"
                >
                  Admin only<span class="fo-sub">owners &amp; admins</span>
                </button>
              </div>
            </div>
            <button class="btn-primary" id="addUserBtn">+ Add user</button>
          </div>
        </div>
        <p class="banners-hint">
          Customers who sign in with Google on the site appear here.
        </p>
        <div class="banner-list" id="userList"></div>
      </main>
    </div>

    <!-- ===== Add-user modal ===== -->
    <div class="modal-overlay" id="addUserModal">
      <form class="modal dish-form" id="addUserForm">
        <h3>Add user</h3>
        <div class="form-grid">
          <label class="span2"
            >Name<input
              name="name"
              required
              maxlength="60"
              placeholder="Full name"
          /></label>
          <label class="span2"
            >Email<input
              name="email"
              type="email"
              required
              placeholder="user@example.com"
          /></label>
          <label class="span2"
            >Password<input
              name="password"
              type="password"
              required
              minlength="6"
              placeholder="••••••••"
          /></label>
          <div class="span2 role-picker" id="rolePicker">
            <button type="button" class="role-opt sel" data-role="admin">
              Admin
            </button>
            <button type="button" class="role-opt" data-role="kitchen">
              Chef
            </button>
            <button type="button" class="role-opt" data-role="customer">
              User
            </button>
          </div>
        </div>
        <p class="login-err" id="addUserErr" hidden></p>
        <div class="form-actions">
          <button type="button" class="btn-outline" id="addUserCancel">
            Cancel
          </button>
          <button type="submit" class="btn-primary">Create user</button>
        </div>
      </form>
    </div>

    <!-- ===== Edit-name modal ===== -->
    <div class="modal-overlay" id="userModal">
      <form class="modal dish-form" id="userForm">
        <h3>Edit user</h3>
        <div class="form-grid">
          <label class="span2"
            >Name<input
              name="name"
              required
              maxlength="60"
              placeholder="Full name"
          /></label>
          <div class="span2" id="userRoleWrap">
            <p class="role-cur" id="userEmailCur">—</p>
            <p class="role-cur">Current role: <b id="userRoleCur">—</b></p>
            <div class="role-picker" id="editRolePicker">
              <button type="button" class="role-opt" data-role="admin">
                Admin
              </button>
              <button type="button" class="role-opt" data-role="kitchen">
                Chef
              </button>
              <button type="button" class="role-opt" data-role="customer">
                User
              </button>
            </div>
          </div>
        </div>
        <p class="login-err" id="userFormErr" hidden></p>
        <div class="form-actions">
          <button type="button" class="btn-outline" id="userCancel">
            Cancel
          </button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </div>

    <div class="toast" id="toast"></div>

    <script src="api.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
