<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu items — Admin</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍽️</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body class="admin-body" data-page="menu">
    <header class="admin-nav">
      <button class="drawer-burger" id="drawerBtn" hidden aria-label="Menu">
        ☰
      </button>
      <a class="brand" href="index.html"
        ><span class="brand-mark">🍽️</span
        ><span class="brand-name">Spice Route <b>Admin</b></span></a
      >
      <div class="admin-nav-right" id="adminNavRight" hidden>
        <a href="http://localhost:3000" class="admin-link">View site ↗</a>
        <button class="btn-outline" id="logoutBtn">Log out</button>
      </div>
    </header>

    <div class="admin-layout" id="adminLayout" hidden>
      <aside class="admin-drawer" id="adminDrawer">
        <div class="drawer-head-m">
          <b>Admin</b>
          <button class="drawer-close" id="drawerClose" aria-label="Close menu">
            ✕
          </button>
        </div>
        <nav class="drawer-nav">
          <a class="drawer-item" href="index.html">
            <span class="di-ic">📊</span>Dashboard
          </a>
          <a class="drawer-item" href="orders.html">
            <span class="di-ic">🧾</span>Orders
          </a>
          <a class="drawer-item" href="kitchen.html">
            <span class="di-ic">👨‍🍳</span>Kitchen / Chef
          </a>
          <a class="drawer-item active" href="menu.html">
            <span class="di-ic">🍽️</span>Menu items
          </a>
          <a class="drawer-item" href="categories.html">
            <span class="di-ic">🏷️</span>Categories
          </a>
          <a class="drawer-item" href="banners.html">
            <span class="di-ic">🖼️</span>Promo banners
          </a>
          <a class="drawer-item" href="users.html">
            <span class="di-ic">👥</span>Users
          </a>
          <a class="drawer-item" id="adminsNavItem" href="admins.html" hidden>
            <span class="di-ic">🛡️</span>Admins
          </a>
        </nav>
      </aside>
      <div class="drawer-scrim" id="drawerScrim"></div>

      <main class="admin-main">
        <div class="admin-toolbar">
          <h2>Menu items</h2>
          <div class="admin-actions">
            <input
              type="search"
              id="adminSearch"
              placeholder="Filter dishes…"
            />
            <button class="btn-outline" id="addCatBtn">+ Category</button>
            <button class="btn-primary" id="addDishBtn">+ Add dish</button>
          </div>
        </div>

        <div class="dish-table-wrap">
          <table class="dish-table">
            <thead>
              <tr>
                <th>Dish</th>
                <th>Category</th>
                <th>Veg</th>
                <th>Price (₹)</th>
                <th>Offer %</th>
                <th>Tag</th>
                <th>Live</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="dishRows"></tbody>
          </table>
          <p class="menu-empty" id="tableEmpty" hidden>
            No dishes yet — add one!
          </p>
        </div>
      </main>
    </div>

    <!-- ===== Dish form modal ===== -->
    <div class="modal-overlay" id="dishModal">
      <form class="modal dish-form" id="dishForm">
        <h3 id="dishFormTitle">Add dish</h3>
        <div class="form-grid">
          <label class="span2"
            >Name<input name="name" required maxlength="80"
          /></label>
          <label
            >Category<select name="category_id" id="catSelect" required></select
          ></label>
          <label
            >Price (₹)<input
              name="price"
              type="number"
              min="1"
              step="1"
              required
          /></label>
          <label
            >Offer %<input
              name="offer_pct"
              type="number"
              min="0"
              max="90"
              placeholder="e.g. 20"
          /></label>
          <label
            >Tag<select name="tag">
              <option value="">—</option>
              <option>Bestseller</option>
              <option>Must try</option>
              <option>New</option>
              <option>Chef's special</option>
            </select></label
          >
          <label class="span2"
            >Description<textarea
              name="description"
              rows="2"
              maxlength="240"
            ></textarea>
          </label>
          <div class="span2 img-upload">
            <label class="file-label"
              >Upload image<input
                name="image_file"
                type="file"
                accept="image/*"
            /></label>
            <img id="imgPreview" hidden alt="dish preview" />
            <button type="button" id="imgRemove" class="img-remove" hidden>
              ✕ Remove
            </button>
            <span id="uploadStatus" class="upload-status"></span>
          </div>
          <label class="check"
            ><input name="is_veg" type="checkbox" checked /> Veg</label
          >
          <label class="check"
            ><input name="is_available" type="checkbox" checked />
            Available</label
          >
        </div>
        <p class="login-err" id="formErr" hidden></p>
        <div class="form-actions">
          <button type="button" class="btn-outline" id="dishCancel">
            Cancel
          </button>
          <button type="submit" class="btn-primary">Save dish</button>
        </div>
      </form>
    </div>

    <div class="toast" id="toast"></div>

    <script src="api.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
